# HMS CI Pipeline
#
# Runs on every push and pull request.
# Uses a real PostgreSQL service for integration tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      NODE_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_SUPERUSER_PASSWORD: ci_postgres_password
      HMS_OWNER_PASSWORD: ci_owner_password
      HMS_APP_PASSWORD: ci_app_password
      DATABASE_URL: postgresql://hms_app:ci_app_password@localhost:5432/hms_test
      DATABASE_MIGRATION_URL: postgresql://hms_owner:ci_owner_password@localhost:5432/hms_test
      SHADOW_DATABASE_URL: postgresql://hms_owner:ci_owner_password@localhost:5432/hms_test_shadow

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize database using docker/init-db.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci_postgres_password
        run: |
          chmod +x docker/init-db.sh
          ./docker/init-db.sh

      - name: Migrate test database (as hms_owner)
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build shared package
        run: pnpm --filter @hms/shared build

      - name: Test (as hms_app)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check licenses
        run: pnpm check:licenses

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Secret scan
        run: |
          # Scan for common secret patterns in tracked files
          # Patterns: AWS keys, private keys, hardcoded passwords in connection strings
          echo "Scanning for secrets in tracked files..."
          FOUND=0
          # AWS access key IDs
          if git grep -InE 'AKIA[0-9A-Z]{16}' -- ':(exclude)*.yml' ':(exclude)scripts/check-licenses.mjs' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Potential AWS access key found"
            FOUND=1
          fi
          # Private keys
          if git grep -InE 'BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY' -- ':(exclude)*.md'; then
            echo "::error::Private key found in repository"
            FOUND=1
          fi
          # Hardcoded passwords in DATABASE_URL (not placeholders)
          if git grep -InE 'DATABASE_URL=.*://[^:]+:[^@]+@' -- '.env' '.env.*' ':(exclude).env.example' 2>/dev/null; then
            echo "::error::Hardcoded database credentials found"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets found. ✓"
